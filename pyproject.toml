[project]
name = "rtop"
version = "0.1.0"
description = "A TUI API Explorer"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pathlib (>=1.0.1,<2.0.0)",
    "urllib3 (>=2.8.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "openapi-pydantic (>=0.6.0,<0.7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
